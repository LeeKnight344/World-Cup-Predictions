name: Docker Image CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-image-publish:
    name: Docker image publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ghcr.io/leeknight344/worldcuppredictions-fixture-predictions:${{ github.sha }} \
            --tag ghcr.io/leeknight344/worldcuppredictions-fixture-predictions:latest
          docker push ghcr.io/leeknight344/worldcuppredictions-fixture-predictions:${{ github.sha }}
          docker push ghcr.io/leeknight344/worldcuppredictions-fixture-predictions:latest
