<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixture Predictions</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>Fixture Predictions</h1>
      <p>Dataverse-backed fixture list and predictions dashboard</p>
    </header>

    <section class="tabs" aria-label="Dashboard sections">
      <div>Fixtures</div>
      <div>Predictions</div>
    </section>

    <section class="grid">
      <section class="panel fixtures-panel" aria-labelledby="fixtures-title">
        <div class="panel-title-row">
          <h2 id="fixtures-title">Fixtures</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <div id="fixtures" class="fixture-list">
          <div class="loading">Loading fixtures…</div>
        </div>
      </section>

      <section class="panel predictions-panel" aria-labelledby="predictions-title">
        <h2 id="predictions-title">Selected prediction</h2>
        <article id="prediction" class="prediction-card empty">
          Select a fixture to view its prediction.
        </article>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
